<div class="div">
  <!--  navbar -->
  <mat-drawer-container class="nav-bar">
    <mat-drawer
      position="end"
      mode="over"
      class="drawer"
      [opened]="this._contratos.$sideBarInfo()"
      (closed)="cerrarPanelesContrato()"
    >
      <app-vista-info-entidad />
    </mat-drawer>
    <mat-drawer-content class="drawer-content">
      <app-sidebar (evento)="eventoSidenav()" />
    </mat-drawer-content>
  </mat-drawer-container>
  <!-- main content -->
  <div class="lado-derecho">
    <div class="body">
      <app-main></app-main>
    </div>
  </div>
</div>
